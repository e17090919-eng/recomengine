name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-packages --frozen
      - name: lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: types
        run: uv run mypy
      - name: config
        run: uv run recsys config-check
      - name: data contract is up to date
        run: |
          uv run recsys schema-doc --out /tmp/data-contract.md
          diff -u docs/data-contract.md /tmp/data-contract.md
      - name: tests
        run: uv run pytest

  image:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f deploy/Dockerfile -t rec-server:ci .
