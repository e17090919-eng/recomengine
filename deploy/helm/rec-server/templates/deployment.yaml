apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels: {app: {{ .Release.Name }}}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: {app: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
        checksum/config: {{ .Values.engineConfig | sha256sum }}
    spec:
      containers:
        - name: rec-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{containerPort: 8000, name: http}]
          env:
            - {name: WORKERS, value: {{ .Values.workers | quote }}}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 30, periodSeconds: 10}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /app/configs/engine.toml, subPath: engine.toml}
            - {name: artifacts, mountPath: /app/artifacts, readOnly: true}
      volumes:
        - name: config
          configMap: {name: {{ .Release.Name }}-config}
        - name: artifacts
          persistentVolumeClaim: {claimName: {{ .Values.artifacts.existingClaim }}}
