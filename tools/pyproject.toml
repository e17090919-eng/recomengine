[project]
name = "recsys-tools"
version = "0.1.0"
description = "Developer & data tools: simulator, historical backfill, CLI"
requires-python = ">=3.11"
dependencies = ["recsys-core", "rec-server", "recsys-batch", "numpy>=1.26", "pandas>=2.2", "pyarrow>=15"]

[project.scripts]
recsys = "recsys_tools.cli:main"

[tool.uv.sources]
recsys-core = { workspace = true }
rec-server = { workspace = true }
recsys-batch = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recsys_tools"]
