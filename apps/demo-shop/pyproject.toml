[project]
name = "demo-shop"
version = "0.1.0"
description = "Demo storefront: a pretend customer integrating the recommendation engine through the public API + Python SDK"
requires-python = ">=3.11"
dependencies = ["recsys-client", "fastapi>=0.110", "uvicorn>=0.29", "pandas>=2.2", "pyarrow>=15"]

[project.scripts]
demo-shop = "demo_shop.app:main"

[tool.uv.sources]
recsys-client = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demo_shop"]
