[project]
name = "recsys-batch"
version = "0.1.0"
description = "Batch jobs: offline baselines and evaluation reports"
requires-python = ">=3.11"
dependencies = ["recsys-core", "rec-server", "numpy>=1.26", "pandas>=2.2", "scikit-learn>=1.4"]

[tool.uv.sources]
recsys-core = { workspace = true }
rec-server = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recsys_batch"]
