[project]
name = "rec-server"
version = "0.1.0"
description = "Online recommendation service: recall, rank, rules, A/B, HTTP API"
requires-python = ">=3.11"
dependencies = [
    "recsys-core",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
lgb = ["lightgbm>=4.3"]  # macOS needs `brew install libomp`

[tool.uv.sources]
recsys-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rec_server"]
