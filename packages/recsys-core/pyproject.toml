[project]
name = "recsys-core"
version = "0.1.0"
description = "Shared contracts: config, canonical data schema, lake storage, data quality, signing"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "numpy>=1.26", "pandas>=2.2", "pyarrow>=15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recsys_core"]
