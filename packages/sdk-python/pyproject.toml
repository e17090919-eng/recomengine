[project]
name = "recsys-client"
version = "0.1.0"
description = "Python SDK for the recsys recommendation API (predict / callback / write / done)"
requires-python = ">=3.9"
dependencies = ["httpx>=0.25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recsys_client"]
